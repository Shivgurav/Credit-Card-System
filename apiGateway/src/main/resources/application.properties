spring.application.name=apiGateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Enable service discovery routing
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
# AUTH SERVICE
#spring.cloud.gateway.routes[0].id=auth-service
#spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
#spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# CARD SERVICE
spring.cloud.gateway.routes[1].id=cardService
spring.cloud.gateway.routes[1].uri=lb://CARDSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/card/**

# TRANSACTION SERVICE
spring.cloud.gateway.routes[2].id=transactionService
spring.cloud.gateway.routes[2].uri=lb://TRANSACTIONSERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/transaction/**

# USER SERVICE
spring.cloud.gateway.routes[3].id=merchantService
spring.cloud.gateway.routes[3].uri=lb://MERCHANTSERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/merchant/**