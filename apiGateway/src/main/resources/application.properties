spring.application.name=api-gateway
server.port=8080

# Eureka configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Enable service discovery for routes
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true


# =========================
# AUTH SERVICE ROUTE
# =========================
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**




# =========================S
# MERCHANT SERVICE ROUTE
# =========================
spring.cloud.gateway.routes[1].id=merchant-service
spring.cloud.gateway.routes[1].uri=lb://MERCHANTSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/merchants/**


# =========================
# TRANSACTION SERVICE ROUTE
# =========================
spring.cloud.gateway.routes[2].id=transaction-service
spring.cloud.gateway.routes[2].uri=lb://TRANSACTIONSERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/transactions/**

# ── CARD SERVICE ──────────────────────────────────────────────
spring.cloud.gateway.routes[3].id=card-service
spring.cloud.gateway.routes[3].uri=lb://CARDSERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/cards/**

# ── CORS ──────────────────────────────────────────────────────
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

